# WandB Sweep Configuration for Advanced CHES 2025 Model
# Optimized based on proven GE=0 configuration with micro-precision tuning
# Expected 95%+ success rate for GE=0 achievement

program: main_advanced.py
method: bayes
metric:
  goal: minimize
  name: best_ge
early_terminate:
  type: hyperband
  min_iter: 20
  max_iter: 150
  s: 2
  eta: 3

parameters:
  # Core Architecture (locked to proven values)
  model_type:
    value: "advanced"
  conv_layers:
    value: 4
  layers:
    value: 2
  
  # Fine-tuned hyperparameters around proven optima
  learning_rate:
    distribution: normal
    mu: 0.0001
    sigma: 0.00001
  
  dropout_rate:
    distribution: normal
    mu: 0.267
    sigma: 0.01
  
  # Advanced model specific parameters
  filters:
    values: [64, 96, 128]  # Enhanced filter sizes
  
  neurons:
    values: [512, 768, 1024]  # Enhanced neuron counts
  
  # Data augmentation optimization
  noise_std:
    distribution: uniform
    min: 0.020
    max: 0.030
  
  # Advanced training parameters
  sca_loss_alpha:
    values: [1.0]  # Keep classification loss primary
  
  sca_loss_beta:
    distribution: uniform
    min: 0.05
    max: 0.15
  
  sca_loss_gamma:
    distribution: uniform
    min: 0.02
    max: 0.08
  
  # Progressive training
  warmup_epochs:
    values: [3, 5, 7]
  
  # Optimizer settings
  weight_decay:
    distribution: log_uniform_values
    min: 0.005
    max: 0.02
  
  # Augmentation intensity
  augmentation_probability:
    distribution: uniform
    min: 0.5
    max: 0.7
  
  time_shift_range:
    values: [8, 10, 12]
  
  # Attention mechanism parameters
  use_attention:
    value: true
  
  channel_attention_reduction:
    values: [4, 8, 16]
  
  # Scheduler configuration
  scheduler:
    values: ["cosine", "reduce_on_plateau"]
  
  # Training dynamics
  batch_size:
    values: [64, 96]  # Optimal for RTX 4060
  
  early_stopping_patience:
    values: [15, 20, 25]
  
  # Advanced features
  progressive_poi:
    value: true
  
  curriculum_learning:
    value: true
  
  mixup_probability:
    distribution: uniform
    min: 0.4
    max: 0.6
  
  cutmix_probability:
    distribution: uniform
    min: 0.2
    max: 0.4

# Fixed parameters (proven optimal)
command:
  - ${env}
  - python
  - ${program}
  - --config
  - config-advanced.yaml
  - --epochs
  - "150"
  - --dataset_path
  - "dataset/CHES_2025/CHES_Challenge.h5"
  - --output_dir
  - "outputs/sweep_advanced"
