program: main_pytorch.py
method: bayes
command:
  - C:\Users\user\Desktop\GE_War\CHES_PANHA\GE_WAR\venv_new\Scripts\python.exe
  - ${program}
  - ${args}
metric:
  name: composite_score
  goal: minimize
parameters:

  # === Model Architecture - PROVEN SUCCESSFUL PATTERNS ===
  model_type:
    value: "cnn" 
  dropout_rate:
    distribution: uniform
    min: 0.25
    max: 0.28  # NARROW AROUND PROVEN 0.267!
  layers:
    values: [2]  # LOCK TO PROVEN VALUE
  neurons:
    values: [512]  # LOCK TO PROVEN 512!
  activation:
    values: ["relu"]  
  conv_layers:
    values: [4]  # LOCK TO PROVEN 4 LAYERS!
  filters:
    values: [32]  # LOCK TO PROVEN 32!
  kernels:
    values: [24]  # LOCK TO PROVEN 24!
  pooling_types:
    values: ["max_pool"]  # Best performing in logs
  pooling_sizes:
    values: [2]  # PROVEN OPTIMAL
  padding:
    values: [0]  # PROVEN OPTIMAL
  # === Training Parameters - OPTIMIZED FOR LOWER NTGE ===
  early_stopping_patience:
    value: 20  # Allow more training for better NTGE
  min_epochs:
    value: 50  # Ensure adequate training
  attack_eval_frequency:
    value: 20   # More frequent evaluation for precision
  
  # === Training and Regularization Parameters ===
  lr:
    distribution: uniform
    min: 0.00008   # Slightly lower for better convergence
    max: 0.00012   # Wider range around proven values
  optimizer:
    values: ['Adam']
  batch_size:
    values: [32]  # LOCK TO PROVEN VALUE - avoid variability
  
  # === Augmentation Parameters ===
  max_shift:
    values: [20]  # PROVEN OPTIMAL
  noise_level:
    distribution: uniform
    min: 0.020   # Back to proven optimal range
    max: 0.024   # Narrow around best performers

  # === Evaluation and Early Stopping ===
  num_traces_attack:
    value: 100000  
  k_folds:
    value: 1  # Single split - faster iteration with 350K samples
    
  # === Fixed Parameters - OPTIMIZED FROM ALL LEARNINGS ===
  epochs:
    value: 250  
  dataset:
    value: "CHES_2025"
  leakage:
    value: "ID"  # Proven superior to HW in all tests
  num_poi:
    values: [250]  # LOCK TO PROVEN OPTIMAL!
  poi_start:
    value: 0
  poi_end:
    value: 7000
  
  # === Dataset Size - MATCH CHALLENGE EVALUATION ===
  train_end:
    value: 350000  